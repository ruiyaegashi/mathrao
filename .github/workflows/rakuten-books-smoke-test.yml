name: Rakuten Books refresh and preview
on:
  push:
    branches:
      - improve/mathrao-layout-step2-20261013
    paths:
      - .github/workflows/rakuten-books-smoke-test.yml
  workflow_dispatch:
    inputs:
      verify_candidates:
        description: 'Verify paper editions of two former Kindle-only slots, no deployment'
        required: false
        type: boolean
        default: false
      build_without_books:
        description: 'Build and verify articles without Rakuten book cards'
        required: false
        type: boolean
        default: false
      publish_bookless_preview:
        description: 'Publish bookless preview and remove old versions, requires build_without_books'
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify candidate ISBNs only (no deployment)
        if: github.event_name == 'push' || inputs.verify_candidates
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
        run: |
          node --input-type=module <<'NODE'
          const isbns = '9784418162185 9784534053381'.split(' ');
          const { RAKUTEN_APP_ID: appId, RAKUTEN_ACCESS_KEY: accessKey, RAKUTEN_AFFILIATE_ID: affiliateId } = process.env;
          if (![appId, accessKey, affiliateId].every(Boolean)) throw Error('Missing Rakuten secrets');
          let exact = 0, missing = 0, incomplete = 0;
          for (const isbn of isbns) {
            const url = new URL('https://openapi.rakuten.co.jp/services/api/BooksBook/Search/20170404');
            url.search = new URLSearchParams({ applicationId: appId, affiliateId, isbn, format: 'json' }).toString();
            const response = await fetch(url, { headers: { accessKey }, redirect: 'error' });
            if (!response.ok) throw Error('Rakuten API failed: HTTP ' + response.status + ' at ISBN ' + isbn);
            const data = await response.json();
            const found = (data.Items ?? []).map(x => x.Item ?? x).find(x => String(x.isbn ?? '') === isbn);
            let result = 'NO_EXACT_MATCH';
            if (found) {
              const https = x => { try { return new URL(x).protocol === 'https:'; } catch { return false; } };
              const ok = Boolean(found.title) &&
                https(found.largeImageUrl || found.mediumImageUrl || found.smallImageUrl) &&
                https(found.affiliateUrl);
              if (ok) { result = 'MATCH'; exact++; } else { result = 'INCOMPLETE'; incomplete++; }
            } else { missing++; }
            // Log only identifiers and status, not API responses or URLs.
            console.log(isbn + ': ' + result);
            await new Promise(resolve => setTimeout(resolve, 1200));
          }
          console.log(JSON.stringify({ checked: isbns.length, completeMatches: exact, noExactMatch: missing, incomplete }));
          NODE

      - name: Generate a single private book snapshot for preview build
        if: (github.event_name == 'workflow_dispatch' && !inputs.verify_candidates && !inputs.build_without_books && !inputs.publish_bookless_preview) || (github.event_name == 'push' && startsWith(github.event.head_commit.message, '[CF-Pages-Skip] STEP19 remove trial 7-day expiry'))
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
        run: node scripts/refresh_rakuten_books.mjs
      - name: Check and build Rakuten pilot
        if: (github.event_name == 'workflow_dispatch' && !inputs.verify_candidates && !inputs.build_without_books && !inputs.publish_bookless_preview) || (github.event_name == 'push' && startsWith(github.event.head_commit.message, '[CF-Pages-Skip] STEP19 remove trial 7-day expiry'))
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
          node scripts/refresh_rakuten_books.mjs --check-selections
          corepack pnpm run check
          corepack pnpm run build
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const expected = {"recommended-study-aid-books-of-mathematics-1":22,"recommended-study-aid-books-of-mathematics-2":49,"recommended-study-aid-books-of-mathematics-3":14,"math-is-useful":7,"how-to-overcome-impatience-and-anxiety":1};
            let allPass = true;
            for (const [slug, expectedCards] of Object.entries(expected)) {
              const html = readFileSync("dist/" + slug + "/index.html", "utf8");
              const cards = (html.match(/data-rakuten-book-card(?=[\s>])/g) || []).length;
              const slots = (html.match(/data-rakuten-book-slot(?=[\s>])/g) || []).length;
              const valid = cards === expectedCards && slots > 0 && !html.includes("data-expires-at") &&
                html.includes("rel=\"sponsored nofollow noopener noreferrer\"");
              console.log(JSON.stringify({ slug, expectedCards, cards, slots, valid }));
              if (!valid) allPass = false;
            }
            if (!allPass) process.exit(1);
          '

      - name: Verify bookless build only (no deployment)
        if: (github.event_name == 'push' && startsWith(github.event.head_commit.message, '[CF-Pages-Skip] STEP17 bookless build')) || (github.event_name == 'workflow_dispatch' && inputs.build_without_books && !inputs.verify_candidates) || (github.event_name == 'push' && startsWith(github.event.head_commit.message, '[CF-Pages-Skip] STEP18 bookless preview once'))
        run: |
          test ! -e src/generated/rakuten-books.json
          corepack enable
          corepack pnpm install --frozen-lockfile
          node scripts/refresh_rakuten_books.mjs --check-selections
          corepack pnpm run check
          corepack pnpm run build
          test ! -e src/generated/rakuten-books.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const groups = JSON.parse(readFileSync('src/data/rakuten-book-selections.json', 'utf8')).selections;
          const articlePaths = [...new Set(groups.map(group => group.articlePath))];
          if (groups.length !== 90 || groups.reduce((n, group) => n + group.isbns.length, 0) !== 93 || articlePaths.length !== 5) {
            throw Error('Approved book selection counts changed; stop the removal test');
          }
          let passed = true;
          for (const articlePath of articlePaths) {
            const html = readFileSync('dist' + articlePath + 'index.html', 'utf8');
            const forbidden = ['data-rakuten-book-card', 'data-rakuten-book-slot', 'data-expires-at'];
            const valid = html.includes('class="article-body"') && !forbidden.some(marker => html.includes(marker));
            console.log(JSON.stringify({ articlePath, bookCards: 0, bookDataInHtml: !valid, valid }));
            if (!valid) passed = false;
          }
          if (!passed) throw Error('Book-derived HTML remains in a no-data build');
          console.log('Bookless build: PASS (not deployed)');
          NODE

      - name: Deploy preview
        if: ((github.event_name == 'workflow_dispatch' && !inputs.verify_candidates && !inputs.build_without_books && !inputs.publish_bookless_preview) || (github.event_name == 'push' && startsWith(github.event.head_commit.message, '[CF-Pages-Skip] STEP18 bookless preview once')) || (github.event_name == 'workflow_dispatch' && inputs.build_without_books && inputs.publish_bookless_preview && !inputs.verify_candidates)) && github.ref == 'refs/heads/improve/mathrao-layout-step2-20261013'
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=mathrao --branch=improve/mathrao-layout-step2-20261013 --commit-hash=${{ github.sha }}

      - name: Verify published preview
        if: ((github.event_name == 'workflow_dispatch' && !inputs.verify_candidates && !inputs.build_without_books && !inputs.publish_bookless_preview) || (github.event_name == 'push' && startsWith(github.event.head_commit.message, '[CF-Pages-Skip] STEP18 bookless preview once')) || (github.event_name == 'workflow_dispatch' && inputs.build_without_books && inputs.publish_bookless_preview && !inputs.verify_candidates)) && github.ref == 'refs/heads/improve/mathrao-layout-step2-20261013'
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.deployment-url }}
          BOOKLESS_PUBLISH: ${{ (github.event_name == 'push' && startsWith(github.event.head_commit.message, '[CF-Pages-Skip] STEP18 bookless preview once')) || (github.event_name == 'workflow_dispatch' && inputs.build_without_books && inputs.publish_bookless_preview && !inputs.verify_candidates) }}
        run: |
          test -n "$PREVIEW_URL"
          if [ "$BOOKLESS_PUBLISH" = "true" ]; then
            for slug in recommended-study-aid-books-of-mathematics-1 recommended-study-aid-books-of-mathematics-2 recommended-study-aid-books-of-mathematics-3 math-is-useful how-to-overcome-impatience-and-anxiety; do
              curl -fsSL --retry 5 --retry-delay 3 "$PREVIEW_URL/$slug/" -o /tmp/mathrao-preview.html
              grep -q 'class="article-body"' /tmp/mathrao-preview.html
              if grep -Eq 'data-rakuten-book-card|data-rakuten-book-slot|data-expires-at' /tmp/mathrao-preview.html; then
                echo "FAIL: book metadata still present in $slug"
                exit 1
              fi
              echo "Published bookless page: PASS $slug"
            done
          else
            curl -fsSL --retry 5 --retry-delay 3 "$PREVIEW_URL/recommended-study-aid-books-of-mathematics-1/" -o /tmp/mathrao-preview.html
            grep -q 'data-rakuten-book-card' /tmp/mathrao-preview.html
            grep -q 'data-expires-at' /tmp/mathrao-preview.html
            echo "Published preview HTML: PASS"
          fi

      - name: Delete older previews from the same branch
        if: ((github.event_name == 'workflow_dispatch' && !inputs.verify_candidates && !inputs.build_without_books && !inputs.publish_bookless_preview) || (github.event_name == 'push' && startsWith(github.event.head_commit.message, '[CF-Pages-Skip] STEP18 bookless preview once')) || (github.event_name == 'workflow_dispatch' && inputs.build_without_books && inputs.publish_bookless_preview && !inputs.verify_candidates)) && github.ref == 'refs/heads/improve/mathrao-layout-step2-20261013'
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CURRENT_ID: ${{ steps.deploy.outputs.pages-deployment-id }}
        run: |
          node --input-type=module <<'NODE'
          const { CF_ACCOUNT, CF_TOKEN, CURRENT_ID } = process.env;
          if (![CF_ACCOUNT, CF_TOKEN, CURRENT_ID].every(Boolean)) throw Error('Missing Cloudflare configuration or deployment ID');
          const branch = 'improve/mathrao-layout-step2-20261013';
          const base = `https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/pages/projects/mathrao/deployments`;
          const headers = { Authorization: `Bearer ${CF_TOKEN}` };
          async function api(url, options = {}) {
            const response = await fetch(url, { ...options, headers });
            const body = await response.json();
            if (!response.ok || !body.success) throw Error('Cloudflare deployment API failed: HTTP ' + response.status + ' ' + JSON.stringify(body.errors ?? []));
            return body;
          }
          const deployments = [];
          for (let page = 1; page <= 20; page++) {
            const data = await api(`${base}?env=preview&per_page=25&page=${page}`);
            deployments.push(...data.result);
            if (page >= (data.result_info?.total_pages ?? 1)) break;
            if (page === 20) throw Error('Too many deployments; do not delete from an incomplete list');
          }
          const same = deployments.filter(d => d.environment === 'preview' && d.deployment_trigger?.metadata?.branch === branch);
          const current = same.find(d => d.id === CURRENT_ID);
          if (!current || current.latest_stage?.status !== 'success') throw Error('Verified current preview not found');
          const currentTime = Date.parse(current.created_on);
          if (!Number.isFinite(currentTime) || same.some(d => d.id !== CURRENT_ID && Date.parse(d.created_on) >= currentTime)) {
            throw Error('A newer or equal-time preview exists; cleanup stopped');
          }
          for (const old of same.filter(d => d.id !== CURRENT_ID)) {
            await api(`${base}/${encodeURIComponent(old.id)}?force=true`, { method: 'DELETE' });
            console.log('Deleted previous preview: ' + old.id.slice(0, 8));
          }
          const remaining = [];
          for (let page = 1; page <= 20; page++) {
            const data = await api(base + '?env=preview&per_page=25&page=' + page);
            remaining.push(...data.result);
            if (page >= (data.result_info?.total_pages ?? 1)) break;
            if (page === 20) throw Error('Incomplete post-deletion list');
          }
          const deleted = same.filter(d => d.id !== CURRENT_ID);
          if (!remaining.some(d => d.id === CURRENT_ID) ||
              deleted.some(old => remaining.some(d => d.id === old.id))) {
            throw Error('Preview deletion verification failed');
          }
          console.log(JSON.stringify({ previewCleanup: 'PASS', deleted: deleted.length, currentPreserved: true }));
          NODE
