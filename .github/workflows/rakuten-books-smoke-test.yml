name: Rakuten Books refresh and preview
on:
  push:
    branches:
      - improve/mathrao-layout-step2-20261013
    paths:
      - .github/workflows/rakuten-books-smoke-test.yml
  workflow_dispatch:
    inputs:
      verify_candidates:
        description: 'Verify 55 new ISBNs (40 textbooks + 15 other books), no deployment'
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify candidate ISBNs only (no deployment)
        if: github.event_name == 'push' || inputs.verify_candidates
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
        run: |
          node --input-type=module <<'NODE'
          const isbns = '9784866154237 9784866153568 9784866154152 9784866154169 9784866154183 9784866154282 9784866153407 9784866152592 9784866152622 9784866152790 9784866152806 9784053054692 9784053055958 9784053056825 9784010349342 9784010349359 9784010349304 9784010349311 9784010349328 9784010349335 9784410105883 9784410105951 9784402252533 9784402262907 9784402262921 9784402234829 9784777230877 9784777230884 9784796165044 9784796165051 9784865317282 9784865317299 9784777231041 9784325273387 9784578243434 9784578243441 9784578240839 9784796113649 9784796113656 9784796113663 9784534050977 9784478022597 9784798156262 9784627016514 9784791763054 9784797345261 9784150502829 9784046019974 9784822259211 9784816353277 9784041026267 9784048650953 9784344032170 9784166610105 9784198646202'.split(' ');
          const { RAKUTEN_APP_ID: appId, RAKUTEN_ACCESS_KEY: accessKey, RAKUTEN_AFFILIATE_ID: affiliateId } = process.env;
          if (![appId, accessKey, affiliateId].every(Boolean)) throw Error('Missing Rakuten secrets');
          let exact = 0, missing = 0, incomplete = 0;
          for (const isbn of isbns) {
            const url = new URL('https://openapi.rakuten.co.jp/services/api/BooksBook/Search/20170404');
            url.search = new URLSearchParams({ applicationId: appId, affiliateId, isbn, format: 'json' }).toString();
            const response = await fetch(url, { headers: { accessKey }, redirect: 'error' });
            if (!response.ok) throw Error('Rakuten API failed: HTTP ' + response.status + ' at ISBN ' + isbn);
            const data = await response.json();
            const found = (data.Items ?? []).map(x => x.Item ?? x).find(x => String(x.isbn ?? '') === isbn);
            let result = 'NO_EXACT_MATCH';
            if (found) {
              const https = x => { try { return new URL(x).protocol === 'https:'; } catch { return false; } };
              const ok = Boolean(found.title) &&
                https(found.largeImageUrl || found.mediumImageUrl || found.smallImageUrl) &&
                https(found.affiliateUrl);
              if (ok) { result = 'MATCH'; exact++; } else { result = 'INCOMPLETE'; incomplete++; }
            } else { missing++; }
            // Log only identifiers and status, not API responses or URLs.
            console.log(isbn + ': ' + result);
            await new Promise(resolve => setTimeout(resolve, 1200));
          }
          console.log(JSON.stringify({ checked: isbns.length, completeMatches: exact, noExactMatch: missing, incomplete }));
          NODE

      - name: Generate a single private book snapshot for preview build
        if: github.event_name == 'workflow_dispatch' && !inputs.verify_candidates
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
        run: node scripts/refresh_rakuten_books.mjs
      - name: Check and build Rakuten pilot
        if: github.event_name == 'workflow_dispatch' && !inputs.verify_candidates
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
          corepack pnpm run check
          corepack pnpm run build
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const p = "dist/recommended-study-aid-books-of-mathematics-1/index.html";
            const html = readFileSync(p, "utf8");
            const checks = {
              existingSlot: html.includes("data-rakuten-slot=\"reference-23\""),
              bookCard: html.includes("data-rakuten-book-card"),
              expiry: html.includes("data-expires-at"),
              affiliateLink: html.includes("rel=\"sponsored nofollow noopener noreferrer\""),
            };
            console.log(JSON.stringify({ checks, allPass: Object.values(checks).every(Boolean) }));
            if (!Object.values(checks).every(Boolean)) process.exit(1);
          '

      - name: Deploy preview
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/improve/mathrao-layout-step2-20261013' && !inputs.verify_candidates
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=mathrao --branch=improve/mathrao-layout-step2-20261013 --commit-hash=${{ github.sha }}

      - name: Verify published preview
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/improve/mathrao-layout-step2-20261013' && !inputs.verify_candidates
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          test -n "$PREVIEW_URL"
          curl -fsSL --retry 5 --retry-delay 3 "$PREVIEW_URL/recommended-study-aid-books-of-mathematics-1/" -o /tmp/mathrao-preview.html
          grep -q 'data-rakuten-book-card' /tmp/mathrao-preview.html
          grep -q 'data-expires-at' /tmp/mathrao-preview.html
          echo "Published preview HTML: PASS"

      - name: Delete older previews from the same branch
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/improve/mathrao-layout-step2-20261013' && !inputs.verify_candidates
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CURRENT_ID: ${{ steps.deploy.outputs.pages-deployment-id }}
        run: |
          node --input-type=module <<'NODE'
          const { CF_ACCOUNT, CF_TOKEN, CURRENT_ID } = process.env;
          if (![CF_ACCOUNT, CF_TOKEN, CURRENT_ID].every(Boolean)) throw Error('Missing Cloudflare configuration or deployment ID');
          const branch = 'improve/mathrao-layout-step2-20261013';
          const base = `https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/pages/projects/mathrao/deployments`;
          const headers = { Authorization: `Bearer ${CF_TOKEN}` };
          async function api(url, options = {}) {
            const response = await fetch(url, { ...options, headers });
            const body = await response.json();
            if (!response.ok || !body.success) throw Error('Cloudflare deployment API failed: HTTP ' + response.status + ' ' + JSON.stringify(body.errors ?? []));
            return body;
          }
          const deployments = [];
          for (let page = 1; page <= 20; page++) {
            const data = await api(`${base}?env=preview&per_page=25&page=${page}`);
            deployments.push(...data.result);
            if (page >= (data.result_info?.total_pages ?? 1)) break;
            if (page === 20) throw Error('Too many deployments; do not delete from an incomplete list');
          }
          const same = deployments.filter(d => d.environment === 'preview' && d.deployment_trigger?.metadata?.branch === branch);
          const current = same.find(d => d.id === CURRENT_ID);
          if (!current || current.latest_stage?.status !== 'success') throw Error('Verified current preview not found');
          const currentTime = Date.parse(current.created_on);
          if (!Number.isFinite(currentTime) || same.some(d => d.id !== CURRENT_ID && Date.parse(d.created_on) >= currentTime)) {
            throw Error('A newer or equal-time preview exists; cleanup stopped');
          }
          for (const old of same.filter(d => d.id !== CURRENT_ID)) {
            await api(`${base}/${encodeURIComponent(old.id)}?force=true`, { method: 'DELETE' });
            console.log('Deleted previous preview: ' + old.id.slice(0, 8));
          }
          console.log('Preview cleanup: PASS');
          NODE
