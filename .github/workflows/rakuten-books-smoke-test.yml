name: Rakuten Books API smoke test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Rakuten book search
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
        run: node scripts/rakuten_books_smoke_test.mjs
      - name: Verify book expiry boundaries (offline)
        run: node scripts/refresh_rakuten_books.mjs --check-expiry
      - name: Generate a single private book snapshot for preview build
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
        run: node scripts/refresh_rakuten_books.mjs
      - name: Check and build Rakuten pilot (no deployment)
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
          corepack pnpm run check
          corepack pnpm run build
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const p = "dist/recommended-study-aid-books-of-mathematics-1/index.html";
            const html = readFileSync(p, "utf8");
            const checks = {
              existingSlot: html.includes("data-rakuten-slot=\"reference-23\""),
              bookCard: html.includes("data-rakuten-book-card"),
              expiry: html.includes("data-expires-at"),
              affiliateLink: html.includes("rel=\"sponsored nofollow noopener noreferrer\""),
            };
            console.log(JSON.stringify({ checks, allPass: Object.values(checks).every(Boolean) }));
            if (!Object.values(checks).every(Boolean)) process.exit(1);
          '
