name: STEP57 Mathrao Technical Residue Accounting

on:
  push:
    branches:
      - bod-step57-residue-accounting
    paths:
      - ".github/workflows/step57-residue-accounting.yml"

permissions:
  contents: read

jobs:
  account:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANCHOR_SHA: 6560dae049caa20af8f7b8b16d3707006505e173

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.ANCHOR_SHA }}
          fetch-depth: 0

      - name: Account current Mathrao technical residue
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import os
          import re
          import subprocess
          from collections import Counter, defaultdict
          from pathlib import Path

          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          root = Path(".")
          articles = sorted((root / "src/content/legacy").glob("*.md"))
          assert articles, "no articles found"

          key_counts = Counter()
          status_counts = Counter()
          wp_filename_count = 0
          wp_filename_id_mismatch = []
          path_nonempty = 0
          legacy_path_nonempty = 0
          published_using_path = 0
          published_using_legacy_path = 0
          published_without_route = []
          featured_count = 0
          featured_unique = set()
          featured_media_count = 0
          featured_images_count = 0
          body_media_occ = 0
          body_media_unique = set()
          body_images_occ = 0
          body_images_unique = set()
          local_absolute_occ = 0
          wp_content_occ = 0
          wp_query_occ = 0
          shortcode_counts = Counter()
          shortcode_articles = Counter()
          technical_article_counts = Counter()
          technical_article_files = defaultdict(set)

          technical_article_patterns = {
              "legacy_path": re.compile(rb"(?m)^legacy_path:"),
              "wp_id": re.compile(rb"(?m)^wp_id:"),
              "legacy_url": re.compile(rb"(?m)^legacy_url:"),
              "legacy_slug": re.compile(rb"(?m)^legacy_slug:"),
              "former_slugs": re.compile(rb"(?m)^former_slugs:"),
              "parent_wp_id": re.compile(rb"(?m)^parent_wp_id:"),
              "wp_date": re.compile(rb"(?m)^wp_date:"),
              "content_type": re.compile(rb"(?m)^content_type:"),
              "source_content_sha256": re.compile(rb"(?m)^source_content_sha256:"),
              "migration_word": re.compile(rb"(?i)\bmigration\b"),
              "legacy_disabled": re.compile(rb"legacy-disabled"),
              "legacy_embed_review": re.compile(rb"legacy-embed-review"),
              "legacy_overrule": re.compile(rb"legacy-overrule"),
              "legacy_wpex": re.compile(rb"legacy-wpex"),
          }

          media_pat = re.compile(rb"/media/[^\s\"'<>\)\]]+")
          images_pat = re.compile(rb"/images/[^\s\"'<>\)\]]+")
          local_abs_pat = re.compile(rb"https?://(?:www\.)?mathrao\.com[^\s\"'<>\)\]]*")
          wp_content_pat = re.compile(rb"/wp-content/", re.I)
          wp_query_pat = re.compile(rb"(?:\?p=|[?&](?:page_id|attachment_id)=)\d+", re.I)
          shortcode_pats = {
              "overrule_open": re.compile(rb"\[overrule(?:\s+[^\]]*)?\]", re.I),
              "overrule_close": re.compile(rb"\[/overrule\]", re.I),
              "wpex_open": re.compile(rb"\[wpex(?:\s+[^\]]*)?\]", re.I),
              "wpex_close": re.compile(rb"\[/wpex\]", re.I),
          }

          for path in articles:
              data = path.read_bytes()
              parts = data.split(b"---", 2)
              assert len(parts) == 3, path
              front = parts[1].decode("utf-8")
              body = parts[2]

              mfile = re.match(r"^wp-(\d{6})-", path.name)
              if mfile:
                  wp_filename_count += 1

              fields = {}
              for line in front.splitlines():
                  m = re.match(r"^([A-Za-z_][A-Za-z0-9_]*):\s*(.*)$", line)
                  if not m:
                      continue
                  k, v = m.group(1), m.group(2).strip()
                  key_counts[k] += 1
                  fields[k] = v

              status = fields.get("status", "").strip().strip('"').strip("'")
              status_counts[status] += 1

              path_val = fields.get("path", "").strip()
              legacy_path_val = fields.get("legacy_path", "").strip()
              path_ok = bool(path_val and path_val not in {"null", "~", '""', "''"})
              legacy_ok = bool(legacy_path_val and legacy_path_val not in {"null", "~", '""', "''"})
              path_nonempty += int(path_ok)
              legacy_path_nonempty += int(legacy_ok)

              if status == "publish":
                  if path_ok:
                      published_using_path += 1
                  elif legacy_ok:
                      published_using_legacy_path += 1
                  else:
                      published_without_route.append(path.as_posix())

              wp_id = fields.get("wp_id")
              if wp_id and mfile:
                  digits = re.sub(r"[^0-9]", "", wp_id)
                  if digits and int(digits) != int(mfile.group(1)):
                      wp_filename_id_mismatch.append((path.name, wp_id))

              featured = fields.get("featured_image", "").strip().strip('"').strip("'")
              if featured:
                  featured_count += 1
                  featured_unique.add(featured)
                  featured_media_count += int(featured.startswith("/media/"))
                  featured_images_count += int(featured.startswith("/images/"))

              body_media = media_pat.findall(body)
              body_images = images_pat.findall(body)
              body_media_occ += len(body_media)
              body_media_unique.update(x.decode("utf-8", "replace") for x in body_media)
              body_images_occ += len(body_images)
              body_images_unique.update(x.decode("utf-8", "replace") for x in body_images)
              local_absolute_occ += len(local_abs_pat.findall(data))
              wp_content_occ += len(wp_content_pat.findall(data))
              wp_query_occ += len(wp_query_pat.findall(data))

              for name, pat in shortcode_pats.items():
                  n = len(pat.findall(body))
                  shortcode_counts[name] += n
                  shortcode_articles[name] += int(n > 0)

              for name, pat in technical_article_patterns.items():
                  n = len(pat.findall(data))
                  technical_article_counts[name] += n
                  if n:
                      technical_article_files[name].add(path.as_posix())

          public_images = sorted((root / "public/images").glob("*")) if (root / "public/images").exists() else []
          public_image_bytes = sum(p.stat().st_size for p in public_images if p.is_file())
          public_image_names = {p.name for p in public_images if p.is_file()}

          middleware = Path("functions/_middleware.js").read_text(encoding="utf-8")
          block = re.search(r"const LEGACY_MEDIA_KEYS = new Set\(\[(.*?)\]\);", middleware, re.S)
          legacy_media_keys = re.findall(r'"([^"]+)"', block.group(1)) if block else []

          errata = json.loads(Path("src/data/errata.json").read_text(encoding="utf-8"))

          tech_named_paths = [p for p in tracked if re.search(r"(?i)(legacy|migration|wordpress|wp[-_/])", p)]
          non_article_occ = Counter()
          non_article_files = defaultdict(set)
          patterns = {
              "legacy_identifier": re.compile(rb"(?i)\blegacy(?:_[A-Za-z0-9_]+|-[A-Za-z0-9_-]+|[A-Za-z0-9_]+)?\b"),
              "wordpress_word": re.compile(rb"(?i)\bwordpress\b"),
              "migration_word": re.compile(rb"(?i)\bmigration\b"),
              "wp_identifier": re.compile(rb"(?i)\bwp_(?:id|date|content|slug|url)\b"),
              "old_images_route": re.compile(rb"/images/"),
          }

          for rel in tracked:
              if rel.startswith("src/content/legacy/"):
                  continue
              p = Path(rel)
              if not p.is_file():
                  continue
              data = p.read_bytes()
              for name, pat in patterns.items():
                  n = len(pat.findall(data))
                  if n:
                      non_article_occ[name] += n
                      non_article_files[name].add(rel)

          readme = Path("README.md").read_text(encoding="utf-8")
          gitignore = Path(".gitignore").read_text(encoding="utf-8")
          config = Path("src/content.config.ts").read_text(encoding="utf-8")
          route = Path("src/pages/[...legacy].astro").read_text(encoding="utf-8")
          markdown = Path("src/lib/legacyMarkdown.ts").read_text(encoding="utf-8")
          layout = Path("src/layouts/BaseLayout.astro").read_text(encoding="utf-8")

          result = {
              "anchor_sha": os.environ["ANCHOR_SHA"],
              "tracked_files": len(tracked),
              "article_files": len(articles),
              "wp_prefixed_article_files": wp_filename_count,
              "wp_filename_id_mismatch": len(wp_filename_id_mismatch),
              "status_counts": dict(status_counts),
              "frontmatter_key_counts": dict(sorted(key_counts.items())),
              "route_fields": {
                  "path_nonempty": path_nonempty,
                  "legacy_path_nonempty": legacy_path_nonempty,
                  "published_using_path": published_using_path,
                  "published_using_legacy_path": published_using_legacy_path,
                  "published_without_route": len(published_without_route),
              },
              "featured_image": {
                  "articles": featured_count,
                  "unique": len(featured_unique),
                  "media_route": featured_media_count,
                  "images_route": featured_images_count,
              },
              "body_media": {
                  "media_occurrences": body_media_occ,
                  "media_unique": len(body_media_unique),
                  "images_occurrences": body_images_occ,
                  "images_unique": len(body_images_unique),
                  "local_absolute_url_occurrences": local_absolute_occ,
                  "wp_content_occurrences": wp_content_occ,
                  "wp_query_occurrences": wp_query_occ,
              },
              "shortcodes": {
                  "occurrences": dict(shortcode_counts),
                  "articles": dict(shortcode_articles),
              },
              "article_technical_counts": dict(technical_article_counts),
              "article_technical_file_counts": {k: len(v) for k,v in technical_article_files.items()},
              "public_images": {
                  "files": len(public_images),
                  "bytes": public_image_bytes,
                  "names": sorted(public_image_names),
              },
              "middleware": {
                  "legacy_media_keys": len(legacy_media_keys),
                  "unique_legacy_media_keys": len(set(legacy_media_keys)),
                  "legacy_key_public_images_overlap": len(set(legacy_media_keys) & public_image_names),
                  "has_images_redirect": "pathname.startsWith('/images/')" in middleware and "Response.redirect" in middleware,
                  "has_media_route": "pathname.startsWith('/media/')" in middleware,
                  "r2_get": "env.MEDIA.get" in middleware,
                  "r2_head": "env.MEDIA.head" in middleware,
                  "r2_write": "env.MEDIA.put" in middleware or "env.MEDIA.delete" in middleware,
              },
              "errata": {
                  "entries": len(errata),
                  "unique_wp_ids": len({e["wp_id"] for e in errata}),
                  "uses_wp_id_key": all("wp_id" in e for e in errata),
                  "renderer_derives_wp_id_from_filename": "match(/^wp-(\\d{6})-/" in markdown,
              },
              "technical_named_paths_count": len(tech_named_paths),
              "technical_named_paths": tech_named_paths,
              "non_article_technical_occurrences": dict(non_article_occ),
              "non_article_technical_file_counts": {k: len(v) for k,v in non_article_files.items()},
              "specific_current_residue": {
                  "content_dir_legacy": Path("src/content/legacy").exists(),
                  "route_file_legacy": Path("src/pages/[...legacy].astro").exists(),
                  "renderer_file_legacy": Path("src/lib/legacyMarkdown.ts").exists(),
                  "config_uses_legacy_dir": "./src/content/legacy" in config,
                  "config_has_legacy_path": "legacy_path" in config,
                  "route_param_legacy": "params: { legacy:" in route,
                  "route_has_legacy_path_fallback": "legacy_path" in route,
                  "renderer_export_legacy_name": "remarkLegacyMarkdown" in markdown,
                  "renderer_legacy_css_classes": any(x in markdown for x in ["legacy-embed-review","legacy-overrule","legacy-wpex"]),
                  "layout_legacy_css_classes": any(x in layout for x in ["legacy-embed-review","legacy-overrule","legacy-wpex"]),
                  "readme_legacy_current_description": "src/content/legacy/" in readme or "legacy shortcodes" in readme.lower(),
                  "readme_stale_public_images_cutover": "temporarily retains" in readme and "public/images/" in readme,
                  "gitignore_wordpress_rescue_patterns": all(x in gitignore for x in ["wp-admin/","wp-content/","wp-includes/","wp-config.php"]),
              },
          }

          out = Path(os.environ["RUNNER_TEMP"]) / "step57-accounting.json"
          out.write_text(json.dumps(result, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Upload STEP57 accounting
        uses: actions/upload-artifact@v4
        with:
          name: step57-mathrao-residue-accounting-${{ github.run_id }}
          path: ${{ runner.temp }}/step57-accounting.json
          if-no-files-found: error
          retention-days: 30
