name: STEP64 Mathrao final residue audit

on:
  push:
    branches:
      - step59-mathrao-neutralize-20261005
    paths:
      - ".github/workflows/step64-final-residue-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d7a8af5b3f7b8f0082086adda4dcbd927eaa2874
          fetch-depth: 1

      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Install / check / build
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "d7a8af5b3f7b8f0082086adda4dcbd927eaa2874"
          pnpm install --frozen-lockfile
          pnpm run check
          pnpm run build

      - name: Audit repository / generated / Production / R2
        run: |
          set -euo pipefail
          python - <<'PY'
          import concurrent.futures
          import json
          import pathlib
          import re
          import subprocess
          import time
          import urllib.error
          import urllib.request

          ROOT = pathlib.Path(".")
          PROD = "https://mathrao.com"
          R2_AUDIT = "https://step59-mathrao-neutralize-20.mathrao.pages.dev/__ydi_step64_r2_audit"
          UA = "YDI-STEP64-Final-Residue-Audit/1.0"

          def fetch(url, method="GET"):
              req = urllib.request.Request(url, method=method, headers={"User-Agent": UA})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, dict(r.headers), r.read() if method != "HEAD" else b""
              except urllib.error.HTTPError as e:
                  return e.code, dict(e.headers), e.read() if method != "HEAD" else b""

          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          suspicious_paths = [
              p for p in tracked
              if re.search(r'(^|/)(legacy|migration|wordpress|wp-admin|wp-content)(/|$)|\[\.\.\.legacy\]|public/images', p, re.I)
          ]

          articles = sorted((ROOT / "src/content/articles").glob("*.md"))
          assert len(articles) == 309, len(articles)

          allowed_keys = {"title", "status", "published_at", "path", "featured_image"}
          published_paths = []
          source_media = set()
          article_frontmatter_bad = []
          article_technical_bad = []
          media_re = re.compile(r'/media/([^"\'<>\s)]+)')

          for p in articles:
              text = p.read_text(encoding="utf-8")
              parts = text.split("---", 2)
              assert len(parts) == 3, p
              front, body = parts[1], parts[2]
              keys = []
              for line in front.splitlines():
                  m = re.match(r'^([A-Za-z_][A-Za-z0-9_]*):', line)
                  if m:
                      keys.append(m.group(1))
              extra_keys = sorted(set(keys) - allowed_keys)
              if extra_keys:
                  article_frontmatter_bad.append((str(p), extra_keys))

              status_m = re.search(r'^status:\s*["\']?([^"\'\s]+)', front, re.M)
              path_m = re.search(r'^path:\s*["\']([^"\']+)["\']', front, re.M)
              assert status_m, p
              status = status_m.group(1)
              assert status in {"published", "draft"}, (p, status)
              if status == "published":
                  assert path_m, p
                  published_paths.append(path_m.group(1))

              technical_patterns = {
                  "old_images_url": r'/images/',
                  "wp_content_url": r'/wp-content/',
                  "wp_query": r'(?:\?p=|page_id=|attachment_id=)',
                  "legacy_wrapper": r'(?:data-legacy|class=["\'][^"\']*legacy-|legacy_path|legacy_url|legacy_slug)',
                  "old_shortcode": r'\[(?:overrule|/overrule|wpex|/wpex)(?:\s|\])',
                  "absolute_local_url": r'https?://(?:www\.)?mathrao\.com/',
              }
              hits = [name for name, pat in technical_patterns.items() if re.search(pat, body, re.I)]
              if hits:
                  article_technical_bad.append((str(p), hits))

              source_media.update(media_re.findall(text))

          assert len(published_paths) == 306, len(published_paths)
          assert len(set(published_paths)) == 306, "duplicate published paths"

          layout = (ROOT / "src/layouts/BaseLayout.astro").read_text(encoding="utf-8")
          source_media.update(media_re.findall(layout))
          assert len(source_media) == 87, len(source_media)

          non_article_bad = []
          banned_runtime = {
              "legacy_path": r'\blegacy_path\b',
              "legacy_url": r'\blegacy_url\b',
              "legacy_slug": r'\blegacy_slug\b',
              "former_slugs": r'\bformer_slugs\b',
              "wp_id": r'\bwp_id\b',
              "parent_wp_id": r'\bparent_wp_id\b',
              "remarkLegacyMarkdown": r'\bremarkLegacyMarkdown\b',
              "LEGACY_MEDIA_KEYS": r'\bLEGACY_MEDIA_KEYS\b',
              "old_images_url": r'/images/',
              "wp_content": r'/wp-content/',
              "wp_admin": r'/wp-admin/',
              "data_legacy": r'data-legacy',
              "legacy_class": r'legacy-(?:overrule|wpex|embed|shortcode|disabled)',
          }
          text_ext = {".astro",".ts",".js",".mjs",".json",".toml",".md",".yml",".yaml"}
          for name in tracked:
              p = ROOT / name
              if not p.is_file() or p.suffix.lower() not in text_ext:
                  continue
              if name.startswith("src/content/articles/") or name == "pnpm-lock.yaml":
                  continue
              try:
                  text = p.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              hits = [key for key, pat in banned_runtime.items() if re.search(pat, text, re.I)]
              if hits:
                  non_article_bad.append((name, hits))

          dist = ROOT / "dist"
          html_files = sorted(dist.rglob("*.html"))
          assert len(html_files) == 308, len(html_files)
          generated_path_bad = [
              str(p.relative_to(dist)) for p in dist.rglob("*")
              if re.search(r'legacy|wordpress|migration|wp-admin|wp-content', str(p.relative_to(dist)), re.I)
          ]
          rendered_bad = []
          generated_patterns = {
              "data_legacy": r'data-legacy',
              "legacy_class": r'class=["\'][^"\']*legacy-',
              "old_images_url": r'/images/',
              "wp_content_url": r'/wp-content/',
              "wp_query": r'(?:\?p=|page_id=|attachment_id=)',
          }
          for p in html_files:
              text = p.read_text(encoding="utf-8")
              hits = [key for key, pat in generated_patterns.items() if re.search(pat, text, re.I)]
              if hits:
                  rendered_bad.append((str(p.relative_to(dist)), hits))

          prod_bad = []
          prod_fail = []

          def audit_prod(path):
              code, _, body = fetch(PROD + path)
              if code != 200:
                  return ("fail", path, code)
              text = body.decode("utf-8", "replace")
              hits = [key for key, pat in generated_patterns.items() if re.search(pat, text, re.I)]
              if hits:
                  return ("bad", path, hits)
              return ("ok", path, None)

          with concurrent.futures.ThreadPoolExecutor(max_workers=16) as pool:
              for kind, path, data in pool.map(audit_prod, published_paths):
                  if kind == "fail":
                      prod_fail.append((path, data))
                  elif kind == "bad":
                      prod_bad.append((path, data))

          home_code, _, home_body = fetch(PROD + "/")
          assert home_code == 200, home_code
          home_text = home_body.decode("utf-8", "replace")
          home_hits = [key for key, pat in generated_patterns.items() if re.search(pat, home_text, re.I)]

          old_images_code, _, _ = fetch(PROD + "/images/jukeizu.png")
          unknown_code, _, _ = fetch(PROD + "/__ydi_step64_not_found__")

          r2 = None
          last = None
          for _ in range(60):
              try:
                  code, _, body = fetch(R2_AUDIT)
                  if code == 200:
                      r2 = json.loads(body.decode("utf-8"))
                      break
                  last = f"HTTP {code}"
              except Exception as e:
                  last = repr(e)
              time.sleep(2)
          if r2 is None:
              raise SystemExit(f"R2 audit endpoint unavailable: {last}")

          actual = {row["key"]: int(row["size"]) for row in r2["objects"]}
          r2_missing = sorted(source_media - set(actual))
          r2_extra = sorted(set(actual) - source_media)
          r2_technical = sorted(k for k in actual if re.search(r'legacy|wordpress|migration|wp-content|wp-admin', k, re.I))

          result = {
              "anchor": subprocess.check_output(["git","rev-parse","HEAD"], text=True).strip(),
              "tracked_files": len(tracked),
              "suspicious_paths": suspicious_paths,
              "articles": len(articles),
              "published": len(published_paths),
              "draft": len(articles) - len(published_paths),
              "frontmatter_bad": article_frontmatter_bad,
              "article_technical_bad": article_technical_bad,
              "non_article_technical_bad": non_article_bad,
              "generated_html": len(html_files),
              "generated_path_bad": generated_path_bad,
              "generated_rendered_bad": rendered_bad,
              "production_articles_checked": len(published_paths),
              "production_fail": prod_fail,
              "production_rendered_bad": prod_bad,
              "production_home": home_code,
              "production_home_bad": home_hits,
              "old_images_status": old_images_code,
              "unknown_status": unknown_code,
              "source_media_keys": len(source_media),
              "r2_objects": len(actual),
              "r2_total_bytes": sum(actual.values()),
              "r2_missing": r2_missing,
              "r2_extra": r2_extra,
              "r2_technical_keys": r2_technical,
          }
          print(json.dumps(result, ensure_ascii=False, indent=2))

          assert not suspicious_paths, suspicious_paths
          assert not article_frontmatter_bad, article_frontmatter_bad[:10]
          assert not article_technical_bad, article_technical_bad[:10]
          assert not non_article_bad, non_article_bad[:10]
          assert not generated_path_bad, generated_path_bad[:10]
          assert not rendered_bad, rendered_bad[:10]
          assert not prod_fail, prod_fail[:10]
          assert not prod_bad, prod_bad[:10]
          assert not home_hits, home_hits
          assert old_images_code == 404, old_images_code
          assert unknown_code == 404, unknown_code
          assert len(actual) == 87, len(actual)
          assert sum(actual.values()) == 19810670, sum(actual.values())
          assert not r2_missing, r2_missing
          assert not r2_extra, r2_extra
          assert not r2_technical, r2_technical
          PY
