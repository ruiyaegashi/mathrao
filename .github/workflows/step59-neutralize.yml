name: STEP59 Mathrao neutralization

on:
  push:
    branches:
      - step59-mathrao-neutralize-20261005

permissions:
  contents: write

jobs:
  neutralize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Baseline check and build
        run: |
          pnpm run check
          pnpm run build
          cp -a dist /tmp/dist-before
      - name: Apply STEP59 transform
        run: python scripts/step59_neutralize.py
      - name: Validate transformed source
        shell: bash
        run: |
          set -euo pipefail
          test "$(find src/content/articles -type f -name '*.md' | wc -l)" -eq 309
          test ! -e src/content/legacy
          test ! -e 'src/pages/[...legacy].astro'
          test -e 'src/pages/[...path].astro'
          test ! -e src/lib/legacyMarkdown.ts
          test ! -e src/data/errata.json
          test ! -e public/images
          test -z "$(find src/content/articles -type f -name 'wp-*.md' -print -quit)"
          ! grep -REn '^(wp_id|legacy_url|legacy_path|legacy_slug|former_slugs|parent_wp_id|parent_title|hierarchy|content_type|wp_date|modified_at|mathrao_section|mathrao_grade|mathrao_course|source_content_sha256):' src/content/articles
          ! grep -REn 'legacy_path|remarkLegacyMarkdown|LEGACY_MEDIA_KEYS|/images/' src/content.config.ts src/pages astro.config.ts functions README.md .gitignore
          cat /tmp/step59-summary.json
          git diff --check
      - name: Build transformed site
        run: |
          rm -rf dist .astro
          pnpm run check
          pnpm run build
      - name: Compare rendered output
        run: python scripts/step59_neutralize.py --compare /tmp/dist-before dist
      - name: Remove temporary STEP59 runner
        run: |
          rm -f scripts/step59_neutralize.py
          rm -f .github/workflows/step59-neutralize.yml
          rmdir scripts 2>/dev/null || true
      - name: Commit STEP59 result
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Neutralize Mathrao article structure (STEP59) [skip ci]'
          git push origin HEAD:step59-mathrao-neutralize-20261005
