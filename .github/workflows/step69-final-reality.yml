name: STEP69 Mathrao final reality

on:
  push:
    branches:
      - step59-mathrao-neutralize-20261005
    paths:
      - ".github/workflows/step69-final-reality.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d7a8af5b3f7b8f0082086adda4dcbd927eaa2874
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Build current main
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm run check
          pnpm run build
      - name: Validate Production and R2
        run: |
          python - <<'PY'
          import concurrent.futures, json, pathlib, re, time, urllib.error, urllib.request
          PROD="https://mathrao.com"
          SNAP="https://step59-mathrao-neutralize-20.mathrao.pages.dev/__ydi_step69_r2"
          UA="YDI-STEP69-Mathrao/1.0"

          def req(url, method="GET"):
              r=urllib.request.Request(url,method=method,headers={"User-Agent":UA})
              try:
                  with urllib.request.urlopen(r,timeout=30) as x:
                      return x.status,dict(x.headers),x.read() if method!="HEAD" else b""
              except urllib.error.HTTPError as e:
                  return e.code,dict(e.headers),e.read() if method!="HEAD" else b""

          articles=[]
          media=set()
          media_re=re.compile(r'/media/([^"\'<>\s)]+)')
          for p in pathlib.Path("src/content/articles").glob("*.md"):
              t=p.read_text(encoding="utf-8")
              fm=t.split("---",2)[1]
              s=re.search(r'^status:\s*["\']?([^"\'\s]+)',fm,re.M)
              path=re.search(r'^path:\s*["\']([^"\']+)["\']',fm,re.M)
              if s and s.group(1)=="published":
                  articles.append(path.group(1))
              media.update(media_re.findall(t))
          media.update(media_re.findall(pathlib.Path("src/layouts/BaseLayout.astro").read_text(encoding="utf-8")))
          assert len(articles)==306
          assert len(media)==87

          bad=[]
          def ca(p):
              code,_,_=req(PROD+p)
              return None if code==200 else (p,code)
          with concurrent.futures.ThreadPoolExecutor(max_workers=16) as ex:
              for x in ex.map(ca,articles):
                  if x: bad.append(x)

          mbad=[]
          def cm(k):
              code,_,_=req(PROD+"/media/"+k,"HEAD")
              return None if code==200 else (k,code)
          with concurrent.futures.ThreadPoolExecutor(max_workers=16) as ex:
              for x in ex.map(cm,sorted(media)):
                  if x: mbad.append(x)

          home=req(PROD+"/")[0]
          oldimg=req(PROD+"/images/jukeizu.png")[0]
          unknown=req(PROD+"/__ydi_step69_not_found__")[0]

          snap=None
          for _ in range(120):
              code,_,body=req(SNAP)
              if code==200:
                  snap=json.loads(body.decode())
                  break
              time.sleep(2)
          assert snap is not None
          keys={o["key"] for o in snap["objects"]}
          assert snap["count"]==87, snap["count"]
          assert snap["total_bytes"]==19810670, snap["total_bytes"]
          assert keys==media, (sorted(media-keys)[:10],sorted(keys-media)[:10])

          assert not bad,bad[:10]
          assert not mbad,mbad[:10]
          assert home==200,home
          assert oldimg==404,oldimg
          assert unknown==404,unknown

          print(json.dumps({
            "main":"d7a8af5b3f7b8f0082086adda4dcbd927eaa2874",
            "build":"PASS",
            "production_articles":306,
            "article_failures":0,
            "production_media":87,
            "media_failures":0,
            "home":200,
            "old_images":404,
            "unknown":404,
            "r2_objects":snap["count"],
            "r2_total_bytes":snap["total_bytes"],
            "r2_exact_set":"PASS"
          },ensure_ascii=False,indent=2))
          PY
