name: STEP63 Mathrao R2 exact-set audit

on:
  push:
    branches:
      - step59-mathrao-neutralize-20261005
    paths:
      - "functions/__ydi_step63_r2_audit.js"
      - ".github/workflows/step63-r2-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Audit current R2 exact keyset through Preview binding
        env:
          AUDIT_URL: https://step59-mathrao-neutralize-20.mathrao.pages.dev/__ydi_step63_r2_audit
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import pathlib
          import re
          import time
          import urllib.error
          import urllib.request

          url = "https://step59-mathrao-neutralize-20.mathrao.pages.dev/__ydi_step63_r2_audit"

          payload = None
          last = None
          for _ in range(60):
              try:
                  req = urllib.request.Request(url, headers={"User-Agent":"YDI-STEP63-R2-Audit/1.0"})
                  with urllib.request.urlopen(req, timeout=20) as r:
                      if r.status == 200:
                          payload = json.loads(r.read().decode("utf-8"))
                          break
                      last = f"HTTP {r.status}"
              except Exception as e:
                  last = repr(e)
              time.sleep(2)

          if payload is None:
              raise SystemExit(f"audit endpoint unavailable: {last}")

          media_re = re.compile(r'/media/([^"\'<>\s)]+)')
          expected = set()
          for path in pathlib.Path("src/content/articles").glob("*.md"):
              expected.update(media_re.findall(path.read_text(encoding="utf-8")))
          expected.update(media_re.findall(pathlib.Path("src/layouts/BaseLayout.astro").read_text(encoding="utf-8")))

          actual = {row["key"]: int(row["size"]) for row in payload["objects"]}
          expected_count = len(expected)
          expected_bytes = 19810670

          missing = sorted(expected - set(actual))
          extra = sorted(set(actual) - expected)
          technical = sorted(k for k in actual if re.search(r'legacy|wordpress|migration|wp-content|wp-admin', k, re.I))

          result = {
              "bucket": payload.get("bucket"),
              "expected_source_keys": expected_count,
              "actual_objects": len(actual),
              "actual_total_bytes": sum(actual.values()),
              "missing": missing,
              "extra": extra,
              "technical_named_keys": technical,
          }
          print(json.dumps(result, ensure_ascii=False, indent=2))

          assert expected_count == 87, expected_count
          assert len(actual) == 87, len(actual)
          assert sum(actual.values()) == expected_bytes, sum(actual.values())
          assert not missing, missing[:20]
          assert not extra, extra[:20]
          assert not technical, technical[:20]
          PY
