name: Mathrao Rakuten Books
on:
  push:
    branches:
      - main
      - improve/mathrao-layout-step2-20261013
permissions:
  contents: read
concurrency:
  group: mathrao-rakuten-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    if: (startsWith(github.event.head_commit.message, '[mathrao-books:update]') || startsWith(github.event.head_commit.message, '[mathrao-books:remove]')) && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/improve/mathrao-layout-step2-20261013')
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      MODE: ${{ startsWith(github.event.head_commit.message, '[mathrao-books:remove]') && 'remove' || 'update' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate approved operation and selection changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const f = 'src/data/rakuten-book-selections.json';
          const current = JSON.parse(readFileSync(f,'utf8'));
          if (current.schemaVersion !== 2 || !Array.isArray(current.selections)) throw Error('Invalid selections');
          const now = new Set(current.selections.flatMap(g => g.isbns));
          if (now.size !== current.selections.reduce((n,g) => n + g.isbns.length,0)) throw Error('Duplicate ISBN');
          if (process.env.MODE === 'remove') {
            const before = process.env.BEFORE_SHA;
            if (!/^[0-9a-f]{40}$/.test(before) || /^0+$/.test(before)) throw Error('Previous commit unavailable');
            const prev = JSON.parse(execFileSync('git',['show',before+':'+f],{encoding:'utf8'}));
            if (!Array.isArray(prev.selections)) throw Error('Invalid previous selections');
            const prior = new Set(prev.selections.flatMap(g => g.isbns));
            const removed = [...prior].filter(isbn => !now.has(isbn));
            if (!removed.length || [...now].some(isbn => !prior.has(isbn))) throw Error('Remove must remove only selected ISBNs');
            console.log(JSON.stringify({operation:'remove',removed:removed.length,remaining:now.size}));
          } else {
            console.log(JSON.stringify({operation:'update',selected:now.size}));
          }
          NODE
      - name: Fetch and validate selected ISBNs
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
          node scripts/refresh_rakuten_books.mjs --check-selections
          node scripts/refresh_rakuten_books.mjs
      - name: Build and validate article cards
        run: |
          corepack pnpm run check
          corepack pnpm run build
          test -f src/generated/rakuten-books.json
          test -f dist/ads.txt
          cmp -s public/ads.txt dist/ads.txt
          cat > /tmp/mathrao-verify.mjs <<'NODE'
          import {readFileSync} from 'node:fs';
          import {join} from 'node:path';
          const root=process.env.HTML_ROOT;
          if (!root) throw Error('HTML_ROOT missing');
          const slugs=['recommended-study-aid-books-of-mathematics-1','recommended-study-aid-books-of-mathematics-2','recommended-study-aid-books-of-mathematics-3','math-is-useful','how-to-overcome-impatience-and-anxiety'];
          const groups=JSON.parse(readFileSync('src/data/rakuten-book-selections.json','utf8')).selections;
          if (groups.some(g=>!slugs.includes(g.articlePath.replaceAll('/','')))) throw Error('Unexpected article selection');
          let total=0;
          for(const slug of slugs){
            const expected=groups.filter(g=>g.articlePath==='/'+slug+'/').flatMap(g=>g.isbns);
            const html=readFileSync(join(root,slug,'index.html'),'utf8');
            const count=(html.match(/data-rakuten-book-card(?=[\s>])/g)||[]).length;
            const isbns=[...html.matchAll(/ISBN ([0-9]{13})/g)].map(m=>m[1]);
            if(count!==expected.length||isbns.length!==expected.length||
               expected.some(isbn=>isbns.filter(x=>x===isbn).length!==1)||
               html.includes('data-expires-at')||!html.includes('class="article-body"')||
               !html.includes('adsbygoogle.js?client=ca-pub-7781274978364717')||
               !html.includes('Amazonのアソシエイトとして'))throw Error('Article card or disclosure mismatch: '+slug);
            if(expected.length&&(!html.includes('Supported by Rakuten Developers')||
               !html.includes('rel="sponsored nofollow noopener noreferrer"')))throw Error('Rakuten attribution missing');
            console.log(JSON.stringify({slug,cards:count,pass:true}));
            total+=count;
          }
          const amazon=readFileSync(join(root,'shikujiri-pythagoras','index.html'),'utf8');
          for(const v of ['www.amazon.co.jp/dp/4046019972','www.amazon.co.jp/dp/4822259218','tag=mathrao-22','Amazonのアソシエイトとして']){
            if(!amazon.includes(v))throw Error('Amazon link/disclosure missing');
          }
          console.log(JSON.stringify({verifiedCards:total}));
          NODE
          HTML_ROOT=dist node /tmp/mathrao-verify.mjs
      - name: Verify automatic production Git builds are disabled
        if: github.ref == 'refs/heads/main'
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const {CF_ACCOUNT, CF_TOKEN}=process.env;
          if(!CF_ACCOUNT || !CF_TOKEN)throw Error('Cloudflare credentials unavailable');
          const url='https://api.cloudflare.com/client/v4/accounts/'+CF_ACCOUNT+'/pages/projects/mathrao';
          const response=await fetch(url,{headers:{Authorization:'Bearer '+CF_TOKEN}});
          if(!response.ok)throw Error('Cannot verify Cloudflare Pages project');
          const data=await response.json();
          if(!data.success)throw Error('Cloudflare Pages project check failed');
          if(data.result?.production_branch!=='main' ||
             data.result?.source?.config?.production_deployments_enabled!==false){
            throw Error('Git production auto-deploy is not disabled; release blocked');
          }
          console.log('Production automatic Git deployments disabled: PASS');
          NODE
      - name: Deploy validated build
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=mathrao --branch=${{ github.ref_name }} --commit-hash=${{ github.sha }}
      - name: Verify published HTTP
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -eu
          test -n "$DEPLOY_URL"
          mkdir -p /tmp/mathrao-http
          for slug in recommended-study-aid-books-of-mathematics-1 recommended-study-aid-books-of-mathematics-2 recommended-study-aid-books-of-mathematics-3 math-is-useful how-to-overcome-impatience-and-anxiety shikujiri-pythagoras; do
            mkdir -p "/tmp/mathrao-http/$slug"
            curl -fsSL --retry 5 --retry-delay 3 --max-time 40 "$DEPLOY_URL/$slug/" -o "/tmp/mathrao-http/$slug/index.html"
          done
          status="$(curl -sSL --retry 5 --retry-delay 3 --max-time 40 -w '%{http_code}' "$DEPLOY_URL/ads.txt" -o /tmp/mathrao-published-ads.txt)"
          test "$status" = "200"
          cmp -s public/ads.txt /tmp/mathrao-published-ads.txt
          HTML_ROOT=/tmp/mathrao-http node /tmp/mathrao-verify.mjs
          echo 'Published cards, links, and ads.txt: PASS'
      - name: Delete old previews of same branch only
        if: github.ref == 'refs/heads/improve/mathrao-layout-step2-20261013'
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CURRENT_ID: ${{ steps.deploy.outputs.pages-deployment-id }}
        run: |

          node --input-type=module <<'NODE'
          const { CF_ACCOUNT, CF_TOKEN, CURRENT_ID } = process.env;
          if (![CF_ACCOUNT, CF_TOKEN, CURRENT_ID].every(Boolean)) throw Error('Missing Cloudflare configuration or deployment ID');
          const branch = 'improve/mathrao-layout-step2-20261013';
          const base = `https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/pages/projects/mathrao/deployments`;
          const headers = { Authorization: `Bearer ${CF_TOKEN}` };
          async function api(url, options = {}) {
            const response = await fetch(url, { ...options, headers });
            const body = await response.json();
            if (!response.ok || !body.success) throw Error('Cloudflare deployment API failed: HTTP ' + response.status + ' ' + JSON.stringify(body.errors ?? []));
            return body;
          }
          const deployments = [];
          for (let page = 1; page <= 20; page++) {
            const data = await api(`${base}?env=preview&per_page=25&page=${page}`);
            deployments.push(...data.result);
            if (page >= (data.result_info?.total_pages ?? 1)) break;
            if (page === 20) throw Error('Too many deployments; do not delete from an incomplete list');
          }
          const same = deployments.filter(d => d.environment === 'preview' && d.deployment_trigger?.metadata?.branch === branch);
          const current = same.find(d => d.id === CURRENT_ID);
          if (!current || current.latest_stage?.status !== 'success') throw Error('Verified current preview not found');
          const currentTime = Date.parse(current.created_on);
          if (!Number.isFinite(currentTime) || same.some(d => d.id !== CURRENT_ID && Date.parse(d.created_on) >= currentTime)) {
            throw Error('A newer or equal-time preview exists; cleanup stopped');
          }
          for (const old of same.filter(d => d.id !== CURRENT_ID)) {
            await api(`${base}/${encodeURIComponent(old.id)}?force=true`, { method: 'DELETE' });
            console.log('Deleted previous preview: ' + old.id.slice(0, 8));
          }
          const remaining = [];
          for (let page = 1; page <= 20; page++) {
            const data = await api(base + '?env=preview&per_page=25&page=' + page);
            remaining.push(...data.result);
            if (page >= (data.result_info?.total_pages ?? 1)) break;
            if (page === 20) throw Error('Incomplete post-deletion list');
          }
          const deleted = same.filter(d => d.id !== CURRENT_ID);
          if (!remaining.some(d => d.id === CURRENT_ID) ||
              deleted.some(old => remaining.some(d => d.id === old.id))) {
            throw Error('Preview deletion verification failed');
          }
          console.log(JSON.stringify({ previewCleanup: 'PASS', deleted: deleted.length, currentPreserved: true }));
          NODE

  step30-http-audit:
    if: github.ref == 'refs/heads/improve/mathrao-layout-step2-20261013' && github.event.head_commit.message == '[CF-Pages-Skip] STEP30 frontmatter-URL audit retry 20261015'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify live production URL from article frontmatter, books, ads and media
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,readdirSync} from 'node:fs';
          import {join} from 'node:path';
          const origin='https://mathrao.com';
          const ensure=(condition,label)=>{if(!condition)throw Error(label)};
          const result={pages:[],books:0,amazon:[],assets:[],notFound:[]};
          async function request(path,method='GET',binary=false){
            const response=await fetch(origin+path,{method,redirect:'manual',headers:{'user-agent':'Mathrao-Independent-HTTP-Audit/1.0'}});
            let body='',byteLength=0;
            if(method!=='HEAD'){
              if(binary){byteLength=(await response.arrayBuffer()).byteLength}
              else{body=await response.text();byteLength=Buffer.byteLength(body)}
            }
            return {status:response.status,body,byteLength,headers:response.headers,location:response.headers.get('location')};
          }
          function html(path,r){
            ensure(r.status===200,path+' HTTP '+r.status+' '+(r.location??''));
            ensure((r.headers.get('content-type')??'').includes('text/html'),path+' non-HTML');
            ensure(r.body.includes('<title>'),path+' missing title');
            ensure(r.body.includes('adsbygoogle.js?client=ca-pub-7781274978364717'),path+' AdSense loader missing');
            ensure(r.body.includes('Amazonのアソシエイトとして'),path+' Amazon disclosure missing');
            ensure(r.body.includes('href="https://mathrao.com'+path+'"'),path+' canonical mismatch');
          }
          const home=await request('/');
          html('/',home);
          result.pages.push({path:'/',status:200});
          const sel=JSON.parse(readFileSync('src/data/rakuten-book-selections.json','utf8'));
          const expected=new Map();
          for(const g of sel.selections){const x=expected.get(g.articlePath)??[];x.push(...g.isbns);expected.set(g.articlePath,x)}
          ensure(sel.selections.length===88&&[...expected.values()].flat().length===91,'selection count changed');
          for(const [path,isbnList] of expected){
            const r=await request(path);html(path,r);
            const count=(r.body.match(/data-rakuten-book-card(?=[\s>])/g)??[]).length;
            const isbns=[...r.body.matchAll(/ISBN ([0-9]{13})/g)].map(m=>m[1]);
            ensure(count===isbnList.length&&isbns.length===isbnList.length,path+' book count mismatch '+count+'/'+isbnList.length);
            ensure(isbnList.every(isbn=>isbns.filter(x=>x===isbn).length===1),path+' ISBN mismatch');
            const links=[...r.body.matchAll(/class="rakuten-book-link" href="([^"]+)"/g)].map(m=>m[1].replaceAll('&amp;','&'));
            const imgs=[...r.body.matchAll(/<img src="([^"]+)" alt="[^"]*の表紙"/g)].map(m=>m[1].replaceAll('&amp;','&'));
            ensure(links.length===isbnList.length&&imgs.length===isbnList.length,path+' book link/image count mismatch');
            for(const link of links){const u=new URL(link);ensure(u.protocol==='https:'&&u.hostname.endsWith('rakuten.co.jp'),path+' invalid Rakuten URL')}
            for(const img of imgs){ensure(new URL(img).protocol==='https:',path+' image URL not HTTPS')}
            ensure(r.body.includes('Supported by Rakuten Developers'),path+' Rakuten attribution missing');
            ensure(r.body.includes('rel="sponsored nofollow noopener noreferrer"'),path+' sponsored rel missing');
            result.books+=count;result.pages.push({path,status:200,cards:count,bookLinks:links.length});
          }
          ensure(result.books===91,'Total book count incorrect');
          console.log('STEP30_BOOKS_PASS '+JSON.stringify({verified:result.books,articles:expected.size}));
          for(const path of ['/shikujiri-pythagoras/','/sitemap/']){
            const r=await request(path);html(path,r);
            result.pages.push({path,status:200});
            if(path==='/shikujiri-pythagoras/'){
              for(const tag of ['www.amazon.co.jp/dp/4046019972','www.amazon.co.jp/dp/4822259218','tag=mathrao-22'])
                ensure(r.body.includes(tag),path+' Amazon link missing '+tag);
              result.amazon.push({path,verifiedLinks:2});
            }
          }
          const folder='src/content/articles';
          const names=readdirSync(folder).filter(n=>n.endsWith('.md')).sort();
          const published=[];
          for(const name of names){
            const raw=readFileSync(join(folder,name),'utf8');
            const front=raw.split('---',3)[1]??'';
            const status=front.match(/^status:\s*["']?([a-z]+)["']?\s*$/m)?.[1];
            const path=front.match(/^path:\s*["']([^"']+)["']\s*$/m)?.[1];
            if(status!=='published')continue;
            ensure(path?.startsWith('/')&&path.endsWith('/'),'Published article missing path: '+name);
            published.push({name,path});
          }
          ensure(published.length>=300,'Unexpected published article count '+published.length);
          const specific=published.find(x=>x.name==='basics-hb-1-3.md');
          ensure(specific?.path==='/basics-of-high-school-math/basics-hb-1-3/','Known article frontmatter mismatch');
          const cases=[specific,published[0],published[Math.floor(published.length/3)],published[Math.floor(published.length*2/3)],published.at(-1)];
          const sampled=[...new Map(cases.map(x=>[x.path,x])).values()];
          for(const a of sampled){
            const r=await request(a.path);html(a.path,r);
            result.pages.push({path:a.path,status:r.status,sampledFrom:a.name});
          }
          console.log('STEP30_ARTICLES_PASS '+JSON.stringify({publishedInRepo:published.length,sampled:sampled.length}));
          const ads=await request('/ads.txt');
          ensure(ads.status===200,'ads.txt GET '+ads.status);
          ensure(ads.body===readFileSync('public/ads.txt','utf8'),'ads.txt content mismatch');
          const adsHead=await request('/ads.txt','HEAD');
          ensure(adsHead.status===200,'ads.txt HEAD '+adsHead.status);
          result.adsTxt={GET:ads.status,HEAD:adsHead.status,match:true};
          console.log('STEP30_ADSTXT_PASS');
          for(const path of ['/media/logo_wide.png','/media/math_classroom.jpg']){
            const g=await request(path,'GET',true),h=await request(path,'HEAD');
            ensure(g.status===200&&h.status===200,path+' media GET/HEAD mismatch '+g.status+'/'+h.status);
            ensure(g.byteLength>0,path+' empty GET media');
            ensure((g.headers.get('content-type')??'').startsWith('image/'),path+' bad media content-type');
            const n=Number(h.headers.get('content-length'));
            ensure(Number.isFinite(n)&&n>0,path+' missing HEAD content-length');
            result.assets.push({path,GET:g.status,HEAD:h.status,getBytes:g.byteLength,headBytes:n,etagPresent:!!h.headers.get('etag')});
          }
          console.log('STEP30_MEDIA_PASS '+JSON.stringify(result.assets));
          for(const path of ['/media/__step30_not_found_20261015__.png','/media/subdir/nested.png','/__step30_not_found_20261015__/']){
            const r=await request(path);
            ensure(r.status===404,path+' expected 404 got '+r.status);
            result.notFound.push({path,status:r.status});
          }
          console.log('STEP30_404_PASS '+JSON.stringify(result.notFound));
          console.log('STEP30_AUDIT '+JSON.stringify(result));
          console.log('STEP30_PASS: independent mathrao.com verified');
          NODE
