name: Mathrao Rakuten Books
on:
  push:
    branches:
      - main
      - improve/mathrao-layout-step2-20261013
permissions:
  contents: read
concurrency:
  group: mathrao-rakuten-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    if: (startsWith(github.event.head_commit.message, '[mathrao-books:update]') || startsWith(github.event.head_commit.message, '[mathrao-books:remove]')) && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/improve/mathrao-layout-step2-20261013')
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      MODE: ${{ startsWith(github.event.head_commit.message, '[mathrao-books:remove]') && 'remove' || 'update' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate approved operation and selection changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const f = 'src/data/rakuten-book-selections.json';
          const current = JSON.parse(readFileSync(f,'utf8'));
          if (current.schemaVersion !== 2 || !Array.isArray(current.selections)) throw Error('Invalid selections');
          const now = new Set(current.selections.flatMap(g => g.isbns));
          if (now.size !== current.selections.reduce((n,g) => n + g.isbns.length,0)) throw Error('Duplicate ISBN');
          if (process.env.MODE === 'remove') {
            const before = process.env.BEFORE_SHA;
            if (!/^[0-9a-f]{40}$/.test(before) || /^0+$/.test(before)) throw Error('Previous commit unavailable');
            const prev = JSON.parse(execFileSync('git',['show',before+':'+f],{encoding:'utf8'}));
            if (!Array.isArray(prev.selections)) throw Error('Invalid previous selections');
            const prior = new Set(prev.selections.flatMap(g => g.isbns));
            const removed = [...prior].filter(isbn => !now.has(isbn));
            if (!removed.length || [...now].some(isbn => !prior.has(isbn))) throw Error('Remove must remove only selected ISBNs');
            console.log(JSON.stringify({operation:'remove',removed:removed.length,remaining:now.size}));
          } else {
            console.log(JSON.stringify({operation:'update',selected:now.size}));
          }
          NODE
      - name: Fetch and validate selected ISBNs
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
          node scripts/refresh_rakuten_books.mjs --check-selections
          node scripts/refresh_rakuten_books.mjs
      - name: Build and validate article cards
        run: |
          corepack pnpm run check
          corepack pnpm run build
          test -f src/generated/rakuten-books.json
          test -f dist/ads.txt
          cmp -s public/ads.txt dist/ads.txt
          cat > /tmp/mathrao-verify.mjs <<'NODE'
          import {readFileSync} from 'node:fs';
          import {join} from 'node:path';
          const root=process.env.HTML_ROOT;
          if (!root) throw Error('HTML_ROOT missing');
          const slugs=['recommended-study-aid-books-of-mathematics-1','recommended-study-aid-books-of-mathematics-2','recommended-study-aid-books-of-mathematics-3','math-is-useful','how-to-overcome-impatience-and-anxiety'];
          const groups=JSON.parse(readFileSync('src/data/rakuten-book-selections.json','utf8')).selections;
          if (groups.some(g=>!slugs.includes(g.articlePath.replaceAll('/','')))) throw Error('Unexpected article selection');
          let total=0;
          for(const slug of slugs){
            const expected=groups.filter(g=>g.articlePath==='/'+slug+'/').flatMap(g=>g.isbns);
            const html=readFileSync(join(root,slug,'index.html'),'utf8');
            const count=(html.match(/data-rakuten-book-card(?=[\s>])/g)||[]).length;
            const isbns=[...html.matchAll(/ISBN ([0-9]{13})/g)].map(m=>m[1]);
            if(count!==expected.length||isbns.length!==expected.length||
               expected.some(isbn=>isbns.filter(x=>x===isbn).length!==1)||
               html.includes('data-expires-at')||!html.includes('class="article-body"')||
               !html.includes('adsbygoogle.js?client=ca-pub-7781274978364717')||
               !html.includes('Amazonのアソシエイトとして'))throw Error('Article card or disclosure mismatch: '+slug);
            if(expected.length&&(!html.includes('Supported by Rakuten Developers')||
               !html.includes('rel="sponsored nofollow noopener noreferrer"')))throw Error('Rakuten attribution missing');
            console.log(JSON.stringify({slug,cards:count,pass:true}));
            total+=count;
          }
          const amazon=readFileSync(join(root,'shikujiri-pythagoras','index.html'),'utf8');
          for(const v of ['www.amazon.co.jp/dp/4046019972','www.amazon.co.jp/dp/4822259218','tag=mathrao-22','Amazonのアソシエイトとして']){
            if(!amazon.includes(v))throw Error('Amazon link/disclosure missing');
          }
          console.log(JSON.stringify({verifiedCards:total}));
          NODE
          HTML_ROOT=dist node /tmp/mathrao-verify.mjs
      - name: Verify automatic production Git builds are disabled
        if: github.ref == 'refs/heads/main'
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const {CF_ACCOUNT, CF_TOKEN}=process.env;
          if(!CF_ACCOUNT || !CF_TOKEN)throw Error('Cloudflare credentials unavailable');
          const url='https://api.cloudflare.com/client/v4/accounts/'+CF_ACCOUNT+'/pages/projects/mathrao';
          const response=await fetch(url,{headers:{Authorization:'Bearer '+CF_TOKEN}});
          if(!response.ok)throw Error('Cannot verify Cloudflare Pages project');
          const data=await response.json();
          if(!data.success)throw Error('Cloudflare Pages project check failed');
          if(data.result?.production_branch!=='main' ||
             data.result?.source?.config?.production_deployments_enabled!==false){
            throw Error('Git production auto-deploy is not disabled; release blocked');
          }
          console.log('Production automatic Git deployments disabled: PASS');
          NODE
      - name: Deploy validated build
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=mathrao --branch=${{ github.ref_name }} --commit-hash=${{ github.sha }}
      - name: Verify published HTTP
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -eu
          test -n "$DEPLOY_URL"
          mkdir -p /tmp/mathrao-http
          for slug in recommended-study-aid-books-of-mathematics-1 recommended-study-aid-books-of-mathematics-2 recommended-study-aid-books-of-mathematics-3 math-is-useful how-to-overcome-impatience-and-anxiety shikujiri-pythagoras; do
            mkdir -p "/tmp/mathrao-http/$slug"
            curl -fsSL --retry 5 --retry-delay 3 --max-time 40 "$DEPLOY_URL/$slug/" -o "/tmp/mathrao-http/$slug/index.html"
          done
          status="$(curl -sSL --retry 5 --retry-delay 3 --max-time 40 -w '%{http_code}' "$DEPLOY_URL/ads.txt" -o /tmp/mathrao-published-ads.txt)"
          test "$status" = "200"
          cmp -s public/ads.txt /tmp/mathrao-published-ads.txt
          HTML_ROOT=/tmp/mathrao-http node /tmp/mathrao-verify.mjs
          echo 'Published cards, links, and ads.txt: PASS'
      - name: Delete old previews of same branch only
        if: github.ref == 'refs/heads/improve/mathrao-layout-step2-20261013'
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CURRENT_ID: ${{ steps.deploy.outputs.pages-deployment-id }}
        run: |

          node --input-type=module <<'NODE'
          const { CF_ACCOUNT, CF_TOKEN, CURRENT_ID } = process.env;
          if (![CF_ACCOUNT, CF_TOKEN, CURRENT_ID].every(Boolean)) throw Error('Missing Cloudflare configuration or deployment ID');
          const branch = 'improve/mathrao-layout-step2-20261013';
          const base = `https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/pages/projects/mathrao/deployments`;
          const headers = { Authorization: `Bearer ${CF_TOKEN}` };
          async function api(url, options = {}) {
            const response = await fetch(url, { ...options, headers });
            const body = await response.json();
            if (!response.ok || !body.success) throw Error('Cloudflare deployment API failed: HTTP ' + response.status + ' ' + JSON.stringify(body.errors ?? []));
            return body;
          }
          const deployments = [];
          for (let page = 1; page <= 20; page++) {
            const data = await api(`${base}?env=preview&per_page=25&page=${page}`);
            deployments.push(...data.result);
            if (page >= (data.result_info?.total_pages ?? 1)) break;
            if (page === 20) throw Error('Too many deployments; do not delete from an incomplete list');
          }
          const same = deployments.filter(d => d.environment === 'preview' && d.deployment_trigger?.metadata?.branch === branch);
          const current = same.find(d => d.id === CURRENT_ID);
          if (!current || current.latest_stage?.status !== 'success') throw Error('Verified current preview not found');
          const currentTime = Date.parse(current.created_on);
          if (!Number.isFinite(currentTime) || same.some(d => d.id !== CURRENT_ID && Date.parse(d.created_on) >= currentTime)) {
            throw Error('A newer or equal-time preview exists; cleanup stopped');
          }
          for (const old of same.filter(d => d.id !== CURRENT_ID)) {
            await api(`${base}/${encodeURIComponent(old.id)}?force=true`, { method: 'DELETE' });
            console.log('Deleted previous preview: ' + old.id.slice(0, 8));
          }
          const remaining = [];
          for (let page = 1; page <= 20; page++) {
            const data = await api(base + '?env=preview&per_page=25&page=' + page);
            remaining.push(...data.result);
            if (page >= (data.result_info?.total_pages ?? 1)) break;
            if (page === 20) throw Error('Incomplete post-deletion list');
          }
          const deleted = same.filter(d => d.id !== CURRENT_ID);
          if (!remaining.some(d => d.id === CURRENT_ID) ||
              deleted.some(old => remaining.some(d => d.id === old.id))) {
            throw Error('Preview deletion verification failed');
          }
          console.log(JSON.stringify({ previewCleanup: 'PASS', deleted: deleted.length, currentPreserved: true }));
          NODE

  step31-browser-audit:
    if: github.ref == 'refs/heads/improve/mathrao-layout-step2-20261013' && github.event.head_commit.message == '[CF-Pages-Skip] STEP31 browser ad and links audit 20261015'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install isolated browser inspection dependency
        run: |
          set -eu
          command -v google-chrome || command -v chromium || command -v chromium-browser
          mkdir -p /tmp/ydi-step31
          npm install --prefix /tmp/ydi-step31 --no-audit --no-fund --ignore-scripts playwright@1.56.1
      - name: Inspect production with desktop and mobile browser viewports
        run: |
          cat > /tmp/ydi-step31/inspect.mjs <<'NODE'
          import { chromium } from 'playwright';
          import { existsSync, mkdirSync, writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const executablePath=['/usr/bin/google-chrome','/usr/bin/chromium','/usr/bin/chromium-browser'].find(existsSync);
          if(!executablePath)throw Error('System chromium executable not found');
          const browser=await chromium.launch({headless:true,executablePath,args:['--no-sandbox','--disable-dev-shm-usage']});
          mkdirSync('/tmp/ydi-step31/evidence',{recursive:true});
          const pages=[
            {name:'home',url:'https://mathrao.com/',expectedBooks:0},
            {name:'books',url:'https://mathrao.com/recommended-study-aid-books-of-mathematics-1/',expectedBooks:22},
            {name:'math',url:'https://mathrao.com/math-is-useful/',expectedBooks:7},
            {name:'amazon',url:'https://mathrao.com/shikujiri-pythagoras/',expectedBooks:0}
          ];
          const setups=[
            {name:'desktop',viewport:{width:1365,height:900},isMobile:false,hasTouch:false},
            {name:'mobile',viewport:{width:390,height:844},isMobile:true,hasTouch:true}
          ];
          const results=[];
          for(const setup of setups){
            const context=await browser.newContext({...setup,locale:'ja-JP',timezoneId:'Asia/Tokyo'});
            for(const target of pages){
              const page=await context.newPage();
              const pageErrors=[],consoleErrors=[],adsResponses=[],adsFailures=[];
              page.on('pageerror',e=>pageErrors.push(e.message.slice(0,250)));
              page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text().slice(0,250))});
              page.on('response',r=>{
                const u=r.url();
                if(/googlesyndication|googleadservices|doubleclick|googleads|googletagservices/i.test(u)){
                  try{const parsed=new URL(u);adsResponses.push({host:parsed.hostname,path:parsed.pathname.slice(0,100),status:r.status()})}catch{}
                }
              });
              page.on('requestfailed',r=>{
                const u=r.url();
                if(/googlesyndication|googleadservices|doubleclick|googleads|googletagservices/i.test(u)){
                  try{adsFailures.push({host:new URL(u).hostname,reason:String(r.failure()?.errorText??'unknown').slice(0,100)})}catch{}
                }
              });
              const response=await page.goto(target.url,{waitUntil:'domcontentloaded',timeout:45000});
              await page.waitForTimeout(6500);
              await page.evaluate(()=>window.scrollTo(0,Math.floor(document.body.scrollHeight*0.6)));
              await page.waitForTimeout(2500);
              await page.evaluate(()=>window.scrollTo(0,0));
              const dom=await page.evaluate(()=>{
                const visible=e=>{const r=e.getBoundingClientRect(),s=getComputedStyle(e);return r.width>2&&r.height>2&&s.display!=='none'&&s.visibility!=='hidden'};
                const scripts=[...document.querySelectorAll('script[src]')].map(x=>x.getAttribute('src'));
                const slots=[...document.querySelectorAll('ins.adsbygoogle')];
                const iframes=[...document.querySelectorAll('iframe')];
                const adFrames=iframes.filter(x=>/google|doubleclick|adsbygoogle|aswift|ad_iframe/i.test((x.src||'')+' '+x.id+' '+x.name));
                const cards=[...document.querySelectorAll('.rakuten-book-card')];
                const links=[...document.querySelectorAll('a.rakuten-book-link')];
                const bookImgs=[...document.querySelectorAll('.rakuten-book-link img')];
                const amazonLinks=[...document.querySelectorAll('a[href*="amazon.co.jp"]')];
                return {
                  title:document.title,documentWidth:document.documentElement.scrollWidth,
                  windowWidth:innerWidth,devicePixelRatio:devicePixelRatio,
                  adLoaderPresent:scripts.some(s=>s?.includes('adsbygoogle.js?client=ca-pub-7781274978364717')),
                  adSlots:slots.map(x=>({status:x.getAttribute('data-ad-status'),loaded:x.getAttribute('data-adsbygoogle-status'),visible:visible(x)})),
                  adFrames:adFrames.map(x=>({visible:visible(x),width:Math.round(x.getBoundingClientRect().width),height:Math.round(x.getBoundingClientRect().height)})),
                  framesAll:iframes.length,
                  bookCardNodes:cards.length,
                  visibleBookCards:cards.filter(visible).length,
                  bookLinks:links.filter(x=>x.href.startsWith('https://')&&x.hostname.endsWith('rakuten.co.jp')).length,
                  coverImages:bookImgs.length,loadedCovers:bookImgs.filter(x=>x.complete&&x.naturalWidth>0).length,
                  amazonLinks:amazonLinks.length,
                  amazonDisclosure:document.body.innerText.includes('Amazonのアソシエイトとして'),
                  rakutenDisclosure:document.body.innerText.includes('広告・書籍紹介'),
                  bodyTextLength:document.body.innerText.length
                };
              });
              const screenshot='/tmp/ydi-step31/evidence/'+setup.name+'-'+target.name+'.png';
              await page.screenshot({path:screenshot,fullPage:false});
              const record={mode:setup.name,page:target.name,status:response?.status()??null,dom,adsResponses:adsResponses.slice(0,30),adsFailures:adsFailures.slice(0,15),pageErrors:pageErrors.slice(0,10),consoleErrors:consoleErrors.slice(0,10),screenshot:screenshot.split('/').at(-1)};
              results.push(record);
              console.log('STEP31_BROWSER '+JSON.stringify(record));
              if(record.status!==200)throw Error('Page HTTP non-200 '+setup.name+' '+target.name);
              if(!dom.adLoaderPresent||!dom.amazonDisclosure)throw Error('Required baseline missing '+setup.name+' '+target.name);
              if(dom.visibleBookCards!==target.expectedBooks||dom.bookLinks!==target.expectedBooks)throw Error('Rendered book cards/links mismatch '+setup.name+' '+target.name+' got '+dom.visibleBookCards+'/'+dom.bookLinks);
              if(target.expectedBooks&&(!dom.rakutenDisclosure||dom.loadedCovers!==target.expectedBooks))throw Error('Rendered Rakuten disclosure or cover images absent '+setup.name+' '+target.name);
              await page.close();
            }
            await context.close();
          }
          writeFileSync('/tmp/ydi-step31/evidence/summary.json',JSON.stringify(results,null,2));
          const adFrames=results.reduce((n,r)=>n+r.dom.adFrames.filter(x=>x.visible).length,0);
          const filled=results.reduce((n,r)=>n+r.dom.adSlots.filter(x=>x.status==='filled').length,0);
          const adsNetwork=results.reduce((n,r)=>n+r.adsResponses.length,0);
          const loaderSuccess=results.reduce((n,r)=>n+r.adsResponses.filter(x=>x.path.includes('/pagead/js/adsbygoogle.js')&&x.status===200).length,0);
          const netErrors=results.reduce((n,r)=>n+r.adsFailures.length,0);
          console.log('STEP31_SUMMARY '+JSON.stringify({sessions:results.length,adFramesVisible:adFrames,slotsFilled:filled,adsNetworkResponses:adsNetwork,loaderStatus200Count:loaderSuccess,adsNetworkFailures:netErrors,uiBaselinePass:true,adActualDisplayConfirmed:adFrames>0||filled>0}));
          console.log('STEP31_BROWSER_AUDIT_COMPLETE');
          await browser.close();
          NODE
          node /tmp/ydi-step31/inspect.mjs
      - name: Upload inspection screenshots and JSON for BOD review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step31-browser-evidence-20261015
          path: /tmp/ydi-step31/evidence/
          if-no-files-found: warn
          retention-days: 7
